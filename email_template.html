<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }
        .container {
            max-width: 90%;
            margin: auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }
        .logo {
            max-width: 150px; /* Adjust width as needed */
            height: auto; /* Maintain aspect ratio */
            margin-right: 20px;
        }
        h1 {
            color: #0a5c69;
            margin: 30px 0 10px 0; /* Increased margin-top for more spacing */
            font-size: 1.5rem;
            display: flex;
            align-items: center;
        }
        .content {
            margin-top: 20px;
        }
        .footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #666;
            text-align: center;
        }
        @media screen and (max-width: 600px) {
            .container {
                padding: 10px;
            }
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            h1 {
                font-size: 1.25rem;
                margin: 30px 0 10px 0; /* Adjust margin for smaller screens */
            }
            .logo {
                max-width: 120px; /* Adjust width as needed for smaller screens */
                margin-bottom: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Location Report</h1>
        </div>
        <div class="content">
            <p><strong>Cleaned Text:</strong></p>
            <p>{{ cleaned_text }}</p>
            <p><strong>Categorized Text:</strong></p>
            <p>{{ categorized_text }}</p>
            <p><strong>Location Text:</strong></p>
            <p>{{ location_text }}</p>
        </div>
        <div class="footer">
            <p>Sent by EENADU AI JOURNALIST COPILOT</p>
        </div>
    </div>
</body>
</html>
